_BASE_: ../deform/deform_base_crop_vessel.yaml

SEED: 2000

MODEL:
  NAME: "cnn_4l_input_edt_fp_vein_cvs_ogopt"
  META_ARCHITECTURE: "PARQ_Deformable_R"
  USE_VESSEL_INFO: "start" # "start", "pos_emb", "no"
  USE_CVS_INFO: "start"
  DEFORMABLE:
    DECODER_ONLY: True
    WITH_RECURRENCE: False
    SHARED_CENTER_HEAD: True
    USE_GLOBAL_PE: True
    USE_DEFORM_ATTN: True
    N_LEVELS: 4
SOLVER:
  SCANS_PER_BATCH: 8
  SAMPLES_PER_SCAN: 8
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 5.0
  OPTIMIZER: "ADAMW"
  AMP:
    ENABLED: True
  SCHED_CYCLE: 68000
  BASE_LR: 0.0001
  MIN_LR: 0.00001
  MAX_ITER: 68000
  FLAT_ITER: 68000
  CLIP_GRADIENTS:
    ENABLED: False
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 5.0
TEST:
  PATCHES_PER_ITER: 24 #  24 = ~12GB
  NMS_TOPK: 40
DATALOADER:
  NUM_WORKERS: 8
DATA:
  PATCH_SIZE: [64, 64, 64]
  OVERLAP: [32, 32, 32]
  N_CHANNELS: 3 # TODO: automate this parameter so it doesn't require changing when using channels for vessel info
  DIR:
    TRAIN:
      SCAN_DIR: "/scratch/ceballosarroyo.a/aneurysm/cta_datasets/internal_train/crop_0.4"
      VESSEL_DIR: "/scratch/ceballosarroyo.a/aneurysm/cta_datasets/internal_train/crop_0.4_vessel_edt_comp"
      CVS_DIR: "/scratch/ceballosarroyo.a/aneurysm/cta_datasets/internal_train/vein_mask_edt_comp"
      ANNOTATION_FILE: "./labels/gt/internal_train_crop_0.4_mixed_fps.csv"

    VAL:
      SCAN_DIR: "/projects/vig/Datasets/cta_datasets/internal_test/crop_0.4"
      ANNOTATION_FILE: "./labels/gt/internal_test_crop_0.4.csv"
      VESSEL_DIR: "/scratch/ceballosarroyo.a/aneurysm/cta_datasets/internal_test/crop_0.4_vessel_edt_comp"
      CVS_DIR: "/scratch/ceballosarroyo.a/aneurysm/cta_datasets/internal_test/vein_mask_edt_comp"
