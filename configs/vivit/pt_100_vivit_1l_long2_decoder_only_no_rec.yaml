_BASE_: ../deform/deform_base_crop_vessel.yaml
SEED: 2000

MODEL:
  NAME: "pt_100_vivit_1l_long2_decoder_only_no_rec"
  META_ARCHITECTURE: "PARQ_ViViT"
  USE_VESSEL_INFO: "no" # "start", "pos_emb", "no"
  USE_CVS_INFO: "no"
  DEFORMABLE:
    DECODER_ONLY: True
    WITH_RECURRENCE: False
    SHARED_CENTER_HEAD: True
    USE_GLOBAL_PE: True
    USE_DEFORM_ATTN: False
    N_LEVELS: 1
  TRANS_MODEL:
    USE_PRETRAINED_ENCODER: False
    PRETRAINED_ENCODER_PATH: "/home/azureuser/workspace/medical/head-ct-pretraining/output_vivit_mae_1_ch_adamw_sampling/checkpoint0010.pth"
  CONV_MODEL:
    BACKBONE_TYPE: "ViViT_1L"
SOLVER:
  SCANS_PER_BATCH: 8
  SAMPLES_PER_SCAN: 8
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 5.0
  SCHED_CYCLE: 100000
  BASE_LR: 0.0002
  MIN_LR: 0.000005
  MAX_ITER: 100000
  FLAT_ITER: 100000
TEST:
  PATCHES_PER_ITER: 48 #  24 = ~12GB
  NMS_TOPK: 40
DATALOADER:
  NUM_WORKERS: 8
DATA:
  PATCH_SIZE: [64, 64, 64]
  OVERLAP: [32, 32, 32]
  N_CHANNELS: 1 # TODO: automate this parameter so it doesn't require changing when using channels for vessel info
  DIR:
    TRAIN:
      SCAN_DIR: "internal_train/crop_0.4"
      ANNOTATION_FILE: "./labels/gt/internal_train_crop_0.4.csv"

    VAL:
      SCAN_DIR: "internal_test/crop_0.4"
      ANNOTATION_FILE: "./labels/gt/internal_test_crop_0.4.csv"
